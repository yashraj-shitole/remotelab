<app-top-nav
  [connected]="relay.status() === 'connected'"
  (menuAction)="setSection('home')"
  (pairAction)="openPairingPopup()">
</app-top-nav>

@if (pairingPopupOpen()) {
  <app-pairing-popup
    [settings]="settings()"
    (close)="closePairingPopup()"
    (connectAction)="connectFromPairingPopup()"
    (settingChange)="updateSetting($event.key, $event.value)">
  </app-pairing-popup>
}

<main class="shell">
  @if (section() === 'home') {
    <app-hero-section (continueCopilot)="continueCopilot()" (createTerminal)="createTerminal()"></app-hero-section>
    <app-connection-section
      [statusLabel]="statusLabel()"
      [peerState]="relay.peerState()"
      [workspaceName]="workspaceName()"
      [diagnosticsTotal]="diagnosticsTotal()">
    </app-connection-section>
  }

  @if (section() === 'ai') {
    <app-ai-section
      [prompt]="prompt()"
      (newCopilot)="newCopilot()"
      (continueCopilot)="continueCopilot()"
      (resumeCopilot)="resumeCopilot()"
      (promptChange)="prompt.set($event)"
      (sendPrompt)="sendPrompt()">
    </app-ai-section>
  }

  @if (section() === 'terminal') {
    <app-terminal-section
      [terminals]="relay.terminals()"
      [activeTerminalId]="relay.activeTerminalId()"
      [activeTerminalOutput]="relay.activeTerminalOutput()"
      [terminalCommand]="terminalCommand()"
      (createTerminal)="createTerminal()"
      (showTerminal)="showTerminal()"
      (syncTerminal)="relay.loadTerminalBuffer()"
      (clearTerminal)="clearTerminal()"
      (killTerminal)="killTerminal()"
      (selectTerminal)="selectTerminal($event)"
      (terminalInput)="relay.appendTerminalInput($event)"
      (dimensionsChange)="resizeTerminal($event)"
      (terminalCommandChange)="terminalCommand.set($event)"
      (runTerminalCommand)="runTerminalCommand()">
    </app-terminal-section>
  }

  @if (section() === 'workspace') {
    <app-workspace-section
      [git]="relay.git()"
      [diagnostics]="relay.diagnostics()"
      [tasks]="relay.tasks()"
      [files]="relay.files()"
      [filePattern]="filePattern()"
      [selectedFile]="selectedFile()"
      [filePreviewLoading]="filePreviewLoading()"
      [fileSaveLoading]="fileSaveLoading()"
      [activeEditor]="relay.snapshot()?.activeEditor"
      (executeCommand)="executeCommand($event)"
      (refreshGit)="refreshGit()"
      (refreshDiagnostics)="refreshDiagnostics()"
      (loadTasks)="loadTasks()"
      (runTask)="runTask($event)"
      (filePatternChange)="filePattern.set($event)"
      (findFiles)="findFiles()"
      (viewFile)="viewFile($event)"
      (saveFile)="saveFile($event)"
      (openFile)="openFile($event)">
    </app-workspace-section>
  }

  @if (section() === 'trackpad') {
    <app-trackpad-section
      [connected]="relay.status() === 'connected'"
      (move)="sendTrackpadMove($event)"
      (scroll)="sendTrackpadScroll($event)"
      (leftClick)="sendTrackpadClick($event)"
      (rightClick)="sendTrackpadClick($event)">
    </app-trackpad-section>
  }

  <app-activity-feed [activity]="relay.activity()"></app-activity-feed>

  @if (relay.lastError()) {
    <p class="error">{{ relay.lastError() }}</p>
  }
</main>

<app-bottom-pill-nav [section]="section()" (sectionChange)="setSection($event)"></app-bottom-pill-nav>
